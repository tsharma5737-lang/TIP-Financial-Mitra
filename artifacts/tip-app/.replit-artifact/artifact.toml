kind = "web"
previewPath = "/"
title = "TIP — Your Financial Mitra"
version = "1.0.0"
id = "artifacts/tip-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25447

[services.development]
run = "pnpm --filter @workspace/tip-financial-mitra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tip-financial-mitra", "run", "build" ]
serve = "static"
publicDir = "artifacts/tip-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25447"
BASE_PATH = "/"
